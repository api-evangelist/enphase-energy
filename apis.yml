apis:
- aid: enphase-energy:enphase-enlighten-commissioning-api
  name: Enphase Enlighten Commissioning API
  description: >
    The Commissioning API is the installer-facing companion to the Monitoring API. Available to Partner-plan
    customers (qualifying installers with 10+ installations), it allows activation creation and updates,
    company and user management, tariff and rate plan updates, and other administrative controls used
    to streamline Enlighten activation workflows from field tools. OAuth 2.0 authorization with the same
    authorize/token endpoints as the Monitoring API.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developer-v4.enphase.com/
  baseURL: https://api.enphaseenergy.com/api/v4
  tags:
