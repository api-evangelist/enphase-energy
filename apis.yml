  - Installer
  - Activation
  - Partner
  properties:
  - type: Documentation
    url: https://developer-v4.enphase.com/docs/quickstart.html
- aid: enphase-energy:enphase-enlighten-vpp-api
  name: Enphase VPP API
  description: >
    The Virtual Power Plant (VPP) API allows energy aggregators and utilities to create and manage VPPs
    that monitor, forecast, and control large fleets of distributed energy resources (DERs) including
    PV systems, batteries, EV chargers, heat pumps, and HVAC units. The API enables demand response programs
    and grid services across Enphase-connected homes and businesses.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
